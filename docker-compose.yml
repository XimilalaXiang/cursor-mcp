services:
  cursor-mcp-bridge:
    build: .
    container_name: cursor-mcp-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8792}:8792"
    networks:
      - default
      - more-stack
    environment:
      PORT: "8792"
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?set BRIDGE_TOKEN in .env}
      CURSOR_API_KEY: ${CURSOR_API_KEY:?set CURSOR_API_KEY in .env}
      CREATE_AGENT_RATE_LIMIT_PER_MINUTE: ${CREATE_AGENT_RATE_LIMIT_PER_MINUTE:-5}
      CURSOR_REQUEST_TIMEOUT_MS: ${CURSOR_REQUEST_TIMEOUT_MS:-30000}
      CURSOR_MCP_MAX_CHARS: ${CURSOR_MCP_MAX_CHARS:-6000}
      DELIVERY_RULES: ${DELIVERY_RULES:-}

networks:
  more-stack:
    external: true
    name: more-stack_default
